r dan hasil lain')}${kpi('Selisih penerimaan − biaya',s('income')-s('cost'),'Menurut rekap kandang')}</div><div class="grid two">${card('Input kandang','Komponen biaya',sankey(farmItems,'Kandang',fsource))}${card('Penerimaan kandang','Nilai hasil produksi dan penjualan lain',sankey([item('Telur',s('egg'),fsource),item('Ayam afkir',s('cull'),fsource),item('Sak bekas',s('sack'),fsource),item('Rabuk',s('manure'),fsource)].filter(d=>d.v>0),'Penerimaan',fsource))}</div><div class="section">${card('Rincian per bulan','Rupiah · rekap biaya dan hasil telur',table(['Masa','Pakan','Obat','Vaksin','Pullet','Biaya total','Telur'],[...a.map(r=>[M[r.month-1],r.feed,r.drug,r.vaccine,r.pullet,r.cost,r.egg]),['Total',s('feed'),s('drug'),s('vaccine'),s('pullet'),s('cost'),s('egg')]],true)+src(fsource))}</div>`}else if(page==='revenue'){h=title('Arus pendapatan','Pendapatan menurut LK P1, bukan pendapatan riil yang telah diverifikasi.');h+=card('Pendapatan tahunan LK P1','Data tahunan tetap ditampilkan pada semua filter',sankey(data.revenue.map((d,i)=>item(['Penjualan kena PPN','Penjualan dibebaskan','Hasil kemitraan','Penjualan telur','Lain-lain'][i],d.value,lsource+' · '+d.ref)), 'Pendapatan LK',lsource)+src(lsource+' · Q10:Q14'));h+=`<div class="section">${card('Ekualisasi telur','Perbandingan sumber per masa',table(['Masa','Laporan kandang','Rekap pajak','Selisih pajak − kandang'],[...a.map(r=>[M[r.month-1],r.egg,r.eggTax,r.eggTax-r.egg]),['Total',s('egg'),s('eggTax'),s('eggTax')-s('egg')]],true)+note('Selisih bulan Maret dan April berbalik; September perlu penelusuran. DPP tambahan tidak boleh dikurangi dari pendapatan tanpa rekonstruksi HPP dan akun lawan.'))}</div>`}else if(page==='vat'){h=title('Arus PPN','PK tambahan dipisahkan dari penjualan sederhana asli. Selisih PK–PM bukan pembayaran kas.');h+=`<div class="grid kpis">${kpi('PK',pk,'Rekap pajak')}${kpi('PM',pm,'Dikreditkan')}${kpi('Selisih PK − PM',diff,'Sebelum kompensasi')}${kpi('SSP dalam rekap',s('pay'),'Belum diverifikasi NTPN')}</div><div class="grid two">${card('Pembentukan PK','Komponen kertas kerja lama',sankey(vatItems,'Total PK',psource)+src(psource))}${card('Pola bulanan','PK asli dan tambahan (Rp juta)',a.map(r=>`<div class="barrow"><span>${M[r.month-1].slice(0,3)}</span><div class="track"><i style="width:${r.realPK/Math.max(...data.rows.map(x=>x.pk))*100}%;background:#2f8f89"></i><i style="width:${r.extraPK/Math.max(...data.rows.map(x=>x.pk))*100}%;background:#d18520"></i></div><span style="text-align:right">${short(r.pk)}</span></div>`).join('')+`<div class="legend"><span><i class="dot" style="background:#2f8f89"></i>Asli</span><span><i class="dot" style="background:#d18520"></i>Tambahan</span></div>`)}</div><div class="section">${card('Rekonsiliasi per masa','Rupiah · selisih PK−PM sebelum kompensasi',table(['Masa','PK asli','PK tambahan','PK rekap','PM','PK − PM','SSP'],[...a.map(r=>[M[r.month-1],r.realPK,r.extraPK,r.pk,r.pm,r.pk-r.pm,r.pay]),['Total',real,ex,pk,pm,diff,s('pay')]],true)+note('Pembulatan komponen PK dapat berbeda beberapa rupiah dari PK rekap. Agustus diambil satu kali karena dua blok identik.'))}</div>`}else if(page==='recon'){h=title('Rekonsiliasi','Perbedaan sumber dipertahankan sebagai selisih terbuka, bukan diselesaikan dengan asumsi.');h+=`<div class="grid two">${card('Pembelian B3','Dua rekap berbeda',table(['Sumber','DPP'],[['RKP · rekap PPN',free],['Rekap pajak (1)',b3],['Selisih',free-b3]],true)+src('RKP!AC35:AC46; Rekap pajak (1)!T8:T19'))}${card('PK tambahan vs kandang','Perbandingan nominal, bukan alokasi',table(['Komponen','Nilai'],[['DPP tambahan',s('extraDPP')],['Pakan, obat dan vaksin',f],['Selisih nominal',s('extraDPP')-f]],true)+note('DPP tambahan merupakan basis jual, biaya kandang basis biaya. Selisih tidak boleh dianggap margin maupun bukti kelebihan PPN.'))}</div><div class="section">${card('Klarifikasi ekualisasi pembelian terdahulu','Tahun penuh · nilai menurut lampiran SP2DK',table(['Penjelasan','Nilai'],[...data.clarify.map nership')renderPartnershipRows();$('#export').disabled=page==='goods';$('#export').title=page==='goods'?'Belum ada data mutasi barang untuk diekspor':'';if(page==='financial'){wireFlow();}document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));let child=document.querySelector('nav button[data-page=partnership]');if(child)child.hidden=!(['revenue','partnership'].includes(page));if(page==='simulation'){function update(){let p=Math.max(0,+$('#pmc').value||0),q=Math.max(0,+$('#pkc').value||0);$('#sim').innerHTML=table(['Skenario','Posisi PK − PM'],[['Posisi awal',diff],['Koreksi PM saja',diff+p],['Koreksi dua sisi',diff+p-q],['Perubahan neto',p-q]],true)+(p>pm||q>pk?note('Nilai koreksi melebihi PM/PK periode yang dipilih. Periksa kembali input.'):'')}$('#pmc').oninput=$('#pkc').oninput=update;update()}}
function setSidebarCollapsed(value){document.body.classList.toggle('sidebar-collapsed',value);const button=$('#sidebarToggle');button.setAttribute('aria-expanded',String(!value));button.setAttribute('aria-label',value?'Perluas sidebar':'Kecilkan sidebar');button.title=value?'Perluas sidebar':'Kecilkan sidebar';button.textContent=value?'›':'‹';try{localStorage.setItem('pdu-sidebar-collapsed',value?'1':'0')}catch(e){}}
let sidebarCollapsed=false;try{sidebarCollapsed=localStorage.getItem('pdu-sidebar-collapsed')==='1'}catch(e){}setSidebarCollapsed(sidebarCollapsed);$('#sidebarToggle').onclick=()=>setSidebarCollapsed(!document.body.classList.contains('sidebar-collapsed'));
$('#nav').innerHTML=navs.map(([p,i,n])=>`<button data-page="${p}" aria-label="${n}" title="${n}" ${p==='partnership'?'class="nav-child" hidden':''}><span class="ni" aria-hidden="true">${i}</span><span class="nav-name">${n}</span></button>`).join('');$('#nav').onclick=e=>{let b=e.target.closest('button');if(b){page=b.dataset.page;render();window.scrollTo(0,0)}};$('#period').innerHTML='<option value="0">Tahun penuh 2023</option>'+M.map((m,i)=>`<option value="${i+1}">${m} 2023</option>`).join('');$('#period').onchange=e=>{period=+e.target.value;render()};$('#mode').onclick=()=>{present=!present;document.body.classList.toggle('present',present);$('#mode').textContent=present?'Mode investigasi':'Mode presentasi';if(present){page='financial';render()} };$('#export').onclick=()=>{let a=page==='purchase'?selectedPurchaseRows():page==='partnership'?selectedPartnershipRows():page==='financial'&&flowBasis==='company'?Object.entries(ledger).map(([cell,value])=>({sumber:'LK P1',sel:cell,nilai:value})):selected();if(!a.length){alert('Tidak ada data untuk diekspor pada periode ini.');return}let keys=Object.keys(a[0]);let csv='\ufeff'+keys.join(';')+'\n'+a.map(r=>keys.map(k=>'"'+String(r[k]).replace(/"/g,'""')+'"').join(';')).join('\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),el=document.createElement('a');el.href=u;el.download='PDU-2023-'+(page==='purchase'?(purchaseMode==='sales'?'penjualan-':'pembelian-')+(period?M[period-1]:'tahunan'):page==='partnership'?'kemitraan-'+partnershipBasis+'-'+(period?M[period-1]:'tahunan'):page==='financial'&&flowBasis==='company'?'LK-P1-tahunan':period?M[period-1]:'tahunan')+'.csv';el.click();setTimeout(()=>URL.revokeObjectURL(u),500)};try{const savedPage=localStorage.getItem('pdu-last-page');if(navs.some(([name])=>name===savedPage))page=savedPage;const savedMode=localStorage.getItem('pdu-data-detail-mode');if(savedMode==='purchase'||savedMode==='sales')purchaseMode=savedMode}catch(e){}render();
