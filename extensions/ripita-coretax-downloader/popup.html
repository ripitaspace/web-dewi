<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>RIPITA Coretax Downloader</h1>
  <label>Jenis dokumen
    <select id="kind">
      <option value="invoice">Faktur Pajak</option>
      <option value="withholding-slip">Bukti Potong</option>
    </select>
  </label>
  <label>Jeda antar unduhan (detik)
    <input id="delay" type="number" min="1" max="30" value="2">
  </label>
  <div class="row">
    <button id="scan">Pindai halaman</button>
    <button id="start" class="primary">Mulai Download</button>
  </div>
  <div class="row">
    <button id="pause" disabled>Jeda</button>
    <button id="stop" disabled>Hentikan</button>
  </div>
  <div id="out" role="status">Buka tabel di Coretax, lalu tekan Pindai.</div>
  <p class="note">Hanya memicu tombol unduh yang tampil di halaman aktif. Periksa daftar Download browser setelah selesai.</p>
  <script src="popup.js"></script>
</body>
</html>
